<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หลังบ้าน — Polaroid_tamsung</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #1D9E75; --green-dark: #0F6E56; --green-light: #E1F5EE;
    --green-border: #9FE1CB;
    --bg: #F7F5F0; --surface: #FFFFFF; --border: rgba(0,0,0,0.1);
    --text: #1a1a1a; --text-muted: #6b6b6b; --text-faint: #aaaaaa;
    --radius: 12px; --radius-sm: 8px; --red: #E24B4A;
  }
  body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
  .logo { width: 38px; height: 38px; background: var(--green); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .logo svg { width: 20px; height: 20px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .header-text h1 { font-size: 15px; font-weight: 600; }
  .header-text p { font-size: 12px; color: var(--text-muted); }
  .back-link { margin-left: auto; font-size: 12px; color: var(--text-faint); text-decoration: none; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); }
  .main { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
  .section-title { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .search-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .input-row { display: flex; gap: 8px; }
  .search-input { flex: 1; padding: 11px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: 'Sarabun', sans-serif; font-size: 14px; background: var(--bg); color: var(--text); outline: none; }
  .search-input:focus { border-color: var(--green); }
  .search-input::placeholder { color: var(--text-faint); }
  .search-btn { padding: 11px 18px; background: var(--green); color: white; border: none; border-radius: var(--radius-sm); font-family: 'Sarabun', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .hint { font-size: 12px; color: var(--text-faint); margin-top: 8px; }
  .sync-bar { font-size: 12px; color: var(--text-faint); display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); flex-shrink: 0; }
  .sync-dot.ok { background: var(--green); }
  .sync-dot.err { background: var(--red); }
  .result-count { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
  .admin-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .admin-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .card-name { font-size: 15px; font-weight: 600; }
  .card-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .tracking-chip { font-size: 11px; background: var(--bg); padding: 4px 10px; border-radius: 20px; font-family: monospace; color: var(--text-muted); flex-shrink: 0; margin-left: 8px; word-break: break-all; text-align: right; max-width: 160px; }
  .photo-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .photo-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .photo-item { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--bg); border: 1px solid var(--border); }
  .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-del { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.6); color: white; border: none; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .upload-area { border: 2px dashed var(--border); border-radius: 8px; padding: 20px 16px; text-align: center; cursor: pointer; transition: all 0.15s; position: relative; }
  .upload-area:hover, .upload-area.drag { border-color: var(--green); background: var(--green-light); }
  .upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-icon { font-size: 28px; margin-bottom: 6px; }
  .upload-text { font-size: 13px; color: var(--text-muted); }
  .upload-text span { color: var(--green); font-weight: 500; }
  .upload-hint { font-size: 11px; color: var(--text-faint); margin-top: 4px; }
  .uploading-bar { margin-top: 8px; display: none; }
  .uploading-text { font-size: 13px; color: var(--green); margin-bottom: 4px; }
  .progress-bar { height: 4px; background: var(--green-light); border-radius: 2px; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 2px; width: 0; transition: width 0.3s; }
  .empty-state { text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 14px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .autodel-card { background: #FFF5F5; border: 1px solid rgba(226,75,74,0.2); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
  .autodel-info { flex: 1; }
  .autodel-title { font-size: 13px; font-weight: 600; color: var(--red); margin-bottom: 2px; }
  .autodel-sub { font-size: 12px; color: var(--text-muted); }
  .autodel-btn { padding: 10px 16px; background: var(--red); color: white; border: none; border-radius: var(--radius-sm); font-family: "Sarabun", sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .autodel-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .secret-btn { width: 32px; height: 32px; background: transparent; border: none; cursor: pointer; opacity: 0; margin-left: 4px; }
  .secret-menu { position: absolute; top: 62px; right: 16px; background: var(--surface); border-radius: var(--radius); box-shadow: 0 4px 24px rgba(0,0,0,0.15); overflow: hidden; display: none; z-index: 100; min-width: 190px; }
  .secret-menu.show { display: block; }
  .secret-item { display: block; padding: 14px 16px; font-size: 14px; font-weight: 500; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border); }
  .secret-item:last-child { border-bottom: none; }
  .secret-item:hover { background: var(--bg); }
</style>
</head>
<body>
<header class="header">
  <div class="logo">
    <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="15" rx="2"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="8" r="1" fill="white" stroke="none"/></svg>
  </div>
  <div class="header-text">
    <h1>หลังบ้าน</h1>
    <p>อัพรูปสินค้าก่อนส่ง</p>
  </div>
  <a href="index.html" class="back-link">← หน้าหลัก</a>
  <a href="parse-order.html" style="margin-left:8px;font-size:12px;color:var(--green);text-decoration:none;padding:6px 10px;border-radius:6px;border:1px solid var(--green-border);background:var(--green-light);">✨ แยกออเดอร์</a>
  <button class="secret-btn" onclick="toggleMenu()" aria-label="menu"></button>
  <div class="secret-menu" id="secretMenu" style="position:absolute;top:62px;right:16px;">
    <a href="status-board.html" class="secret-item">📊 บอร์ดสถานะ</a>
  </div>
</header>

<main class="main">
  <div class="sync-bar">
    <div class="sync-dot" id="syncDot"></div>
    <span id="syncStatus">กำลังโหลดข้อมูล...</span>
  </div>
  <div class="autodel-card">
    <div class="autodel-info">
      <div class="autodel-title">🗑 ลบรูปเก่าเกิน 7 วัน</div>
      <div class="autodel-sub" id="autodelSub">ลบรูปทั้งหมดที่อัพโหลดเกิน 7 วันแล้วออกจาก Supabase</div>
    </div>
    <button class="autodel-btn" id="autodelBtn" onclick="autoDeleteOld()">ลบเลย</button>
  </div>
  <p class="section-title">ค้นหาลูกค้า</p>
  <div class="search-card">
    <div class="input-row">
      <input class="search-input" id="searchInput" placeholder="ชื่อ, เบอร์, หรือรหัส PT-XXXXX..." oninput="doSearch()" autocomplete="off"/>
      <button class="search-btn" onclick="doSearch()">ค้นหา</button>
    </div>
    <p class="hint">พิมพ์บางส่วนก็ได้ค่ะ</p>
  </div>
  <div id="results"></div>
</main>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://zduqfsbohimmvoxiikxf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkdXFmc2JvaGltbXZveGlpa3hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3Nzc2NzIsImV4cCI6MjA5NTM1MzY3Mn0.WBX4APPw1Wn8fJzMZjEtzOgA_-cs29pkJgZwr95wIFw";
const BUCKET = "parcel-photos";
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRTvOZSL9sX3ezpv8wGlhHB4o50K6dPYPs5L_64JjQSbVPGtutC-YYixoMe_z7yJ8MY2rdmN64MEZTE/pub?output=csv";
let DB = [];

function splitCSV(line) {
  const r = []; let c = "", q = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') q = !q;
    else if (line[i] === ',' && !q) { r.push(c.trim()); c = ""; }
    else c += line[i];
  } r.push(c.trim()); return r;
}
function parseCSV(text) {
  const rows = [];
  let cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') { q = !q; cur += ch; }
    else if ((ch === '\n' || ch === '\r') && !q) {
      if (text[i] === '\r' && text[i+1] === '\n') i++;
      if (cur.trim()) rows.push(cur);
      cur = "";
    } else { cur += ch; }
  }
  if (cur.trim()) rows.push(cur);
  if (rows.length < 2) return [];
  const h = splitCSV(rows[0]).map(x => x.trim());
  return rows.slice(1).map(l => {
    const v = splitCSV(l), o = {};
    h.forEach((k,i) => o[k] = (v[i]||"").trim());
    return o;
  }).filter(r => Object.values(r).some(v => v));
}
function mapRow(r) {
  return {
    tracking:  r["หมายเลขติดตามพัสดุ"]||"",
    name:      r["ชื่อผู้รับ"]||"",
    phone:     r["หมายเลขโทรศัพท์ผู้รับ"]||"",
    province:  r["จังหวัดของผู้รับ"]||"",
    date:      r["รอบจัดส่ง"]||"",
    courier:   r["SPX"]||"SPX",
    orderCode: r["รหัสออเดอร์"]||"",
  };
}

async function sbHeaders() {
  return { "apikey": SUPABASE_KEY, "Authorization": "Bearer "+SUPABASE_KEY };
}

async function getPhotos(orderCode) {
  if (!orderCode) return [];
  try {
    const res = await fetch(SUPABASE_URL+"/storage/v1/object/list/"+BUCKET, {
      method: "POST",
      headers: { ...(await sbHeaders()), "Content-Type": "application/json" },
      body: JSON.stringify({ prefix: orderCode+"/", limit: 20 })
    });
    if (!res.ok) return [];
    const data = await res.json();
    const ts = Date.now();
    return (data||[]).filter(f => f.name).map(f =>
      SUPABASE_URL+"/storage/v1/object/public/"+BUCKET+"/"+orderCode+"/"+f.name+"?t="+ts
    );
  } catch { return []; }
}

async function uploadPhoto(file, orderCode) {
  const ext = file.name.split(".").pop() || "jpg";
  const filename = Date.now()+"_"+Math.random().toString(36).slice(2)+"."+ext;
  const path = orderCode+"/"+filename;
  const res = await fetch(SUPABASE_URL+"/storage/v1/object/"+BUCKET+"/"+path, {
    method: "POST",
    headers: { ...(await sbHeaders()), "Content-Type": file.type||"image/jpeg", "x-upsert": "true" },
    body: file
  });
  if (!res.ok) throw new Error("Upload failed");
  return SUPABASE_URL+"/storage/v1/object/public/"+BUCKET+"/"+path;
}

async function deletePhoto(orderCode, filename, i) {
  orderCode = orderCode.trim();
  const path = orderCode+"/"+filename;
  const res = await fetch(SUPABASE_URL+"/storage/v1/object/"+BUCKET+"/"+path, {
    method: "DELETE",
    headers: await sbHeaders(),
  });
  if (!res.ok) {
    const err = await res.text();
    showToast("❌ ลบไม่สำเร็จ: "+err);
    return;
  }
  await refreshGrid(orderCode, i);
  showToast("🗑 ลบรูปแล้ว");
}

async function getPhotosWithMeta(orderCode) {
  if (!orderCode) return [];
  try {
    const res = await fetch(SUPABASE_URL+"/storage/v1/object/list/"+BUCKET, {
      method: "POST",
      headers: { ...(await sbHeaders()), "Content-Type": "application/json" },
      body: JSON.stringify({ prefix: orderCode+"/", limit: 100 })
    });
    if (!res.ok) return [];
    const data = await res.json();
    return (data||[]).filter(f => f.name && f.created_at).map(f => ({
      path: orderCode+"/"+f.name,
      created_at: new Date(f.created_at)
    }));
  } catch { return []; }
}

async function autoDeleteOld() {
  const btn = document.getElementById("autodelBtn");
  const sub = document.getElementById("autodelSub");
  const confirmed = confirm("ยืนยันลบรูปที่อัพโหลดเกิน 7 วันทั้งหมดออกจาก Supabase ใช่ไหมคะ?");
  if (!confirmed) return;

  btn.disabled = true;
  btn.textContent = "กำลังสแกน...";
  sub.textContent = "กำลังตรวจสอบไฟล์ทั้งหมด...";

  const cutoff = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
  const allOrderCodes = DB.map(r => r.orderCode).filter(Boolean);
  let toDelete = [];

  for (const orderCode of allOrderCodes) {
    const files = await getPhotosWithMeta(orderCode);
    const old = files.filter(f => f.created_at < cutoff);
    toDelete = toDelete.concat(old.map(f => f.path));
  }

  if (toDelete.length === 0) {
    sub.textContent = "ไม่มีรูปที่เก่าเกิน 7 วันค่ะ ✨";
    btn.disabled = false;
    btn.textContent = "ลบเลย";
    showToast("✨ ไม่มีรูปที่ต้องลบค่ะ");
    return;
  }

  sub.textContent = "กำลังลบ "+toDelete.length+" ไฟล์...";

  let deleted = 0;
  for (const path of toDelete) {
    const res = await fetch(SUPABASE_URL+"/storage/v1/object/"+BUCKET+"/"+path, {
      method: "DELETE",
      headers: await sbHeaders(),
    });
    if (res.ok) deleted++;
    sub.textContent = "ลบแล้ว "+deleted+"/"+toDelete.length+" ไฟล์...";
  }

  btn.disabled = false;
  btn.textContent = "ลบเลย";
  sub.textContent = "ลบรูปทั้งหมดที่อัพโหลดเกิน 7 วันแล้วออกจาก Supabase";
  showToast("🗑 ลบรูปเก่าแล้ว "+deleted+" ไฟล์");
}

async function loadSheet() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error();
    const text = await res.text();
    DB = parseCSV(text).map(mapRow).filter(r => r.tracking||r.name);
    document.getElementById("syncStatus").textContent = "โหลดข้อมูลสำเร็จ ("+DB.length+" รายการ)";
    document.getElementById("syncDot").className = "sync-dot ok";
  } catch {
    document.getElementById("syncStatus").textContent = "โหลดไม่สำเร็จ";
    document.getElementById("syncDot").className = "sync-dot err";
  }
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

async function doSearch() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const container = document.getElementById("results");
  if (!q) { container.innerHTML = ""; return; }
  const found = DB.filter(r =>
    r.name.toLowerCase().includes(q) ||
    r.phone.includes(q) ||
    r.orderCode.toLowerCase().includes(q)
  );
  if (!found.length) { container.innerHTML = '<div class="empty-state">🔍<br>ไม่พบลูกค้า</div>'; return; }
  container.innerHTML = '<p class="result-count">กำลังโหลด...</p>';
  const cards = await Promise.all(found.map((r,i) => buildCard(r,i)));
  container.innerHTML = '<p class="result-count">พบ '+found.length+' รายการ</p>' + cards.join("");
  found.forEach((r,i) => attachUpload(r.orderCode, i));
}

async function buildCard(r, i) {
  const photos = await getPhotos(r.orderCode);
  return '<div class="admin-card">'+
    '<div class="admin-card-top">'+
      '<div><div class="card-name">'+r.name+'</div>'+
      '<div class="card-sub">'+r.phone+(r.province?' · '+r.province:'')+'</div></div>'+
      '<span class="tracking-chip">'+r.orderCode+'</span>'+
    '</div>'+
    '<div class="photo-section">'+
      '<div class="photo-label" id="label_'+i+'">📷 รูปสินค้า ('+photos.length+' รูป)</div>'+
      '<div class="photo-grid" id="grid_'+i+'">'+
        photos.map(url => {
          const fname = url.split("/").pop();
          return '<div class="photo-item"><img src="'+url+'" loading="lazy"><button class="photo-del" onclick="deletePhoto(\''+r.orderCode+'\',\''+fname+'\','+i+')">✕</button></div>';
        }).join("")+
      '</div>'+
      '<label class="upload-area" ondragover="event.preventDefault();this.classList.add(\'drag\')" ondragleave="this.classList.remove(\'drag\')" ondrop="handleDrop(event,\''+r.orderCode+'\','+i+')">'+
        '<input type="file" accept="image/*" multiple id="fileInput_'+i+'">'+
        '<div class="upload-icon">📸</div>'+
        '<div class="upload-text"><span>กดเพื่อเลือกรูป</span> หรือลากมาวาง</div>'+
        '<div class="upload-hint">รองรับ JPG, PNG, HEIC • อัพหลายรูปพร้อมกันได้</div>'+
        '<div class="uploading-bar" id="uploading_'+i+'">'+
          '<div class="uploading-text">⏳ กำลังอัพโหลด...</div>'+
          '<div class="progress-bar"><div class="progress-fill" id="fill_'+i+'"></div></div>'+
        '</div>'+
      '</label>'+
    '</div>'+
  '</div>';
}

function attachUpload(orderCode, i) {
  const inp = document.getElementById("fileInput_"+i);
  if (inp) inp.addEventListener("change", function() {
    handleFiles(Array.from(this.files), orderCode, i);
    this.value = "";
  });
}

function handleDrop(e, orderCode, i) {
  e.preventDefault();
  e.currentTarget.classList.remove("drag");
  handleFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith("image/")), orderCode, i);
}

async function handleFiles(files, orderCode, i) {
  if (!files.length) return;
  const uploadEl = document.getElementById("uploading_"+i);
  const fillEl = document.getElementById("fill_"+i);
  uploadEl.style.display = "block";
  let done = 0;
  for (const file of files) {
    try {
      await uploadPhoto(file, orderCode);
    } catch { showToast("❌ อัพโหลดไม่สำเร็จ ลองใหม่ค่ะ"); }
    done++;
    fillEl.style.width = (done/files.length*100)+"%";
  }
  uploadEl.style.display = "none";
  fillEl.style.width = "0";
  await new Promise(r => setTimeout(r, 1000));
  await refreshGrid(orderCode, i);
  showToast("✅ อัพโหลดสำเร็จ "+done+" รูป");
}

async function refreshGrid(orderCode, i) {
  const photos = await getPhotos(orderCode);
  document.getElementById("grid_"+i).innerHTML = photos.map(url => {
    const fname = url.split("/").pop();
    return '<div class="photo-item"><img src="'+url+'" loading="lazy"><button class="photo-del" onclick="deletePhoto(\''+orderCode+'\',\''+fname+'\','+i+')">✕</button></div>';
  }).join("");
  document.getElementById("label_"+i).textContent = "📷 รูปสินค้า ("+photos.length+" รูป)";
}

function toggleMenu() { document.getElementById("secretMenu").classList.toggle("show"); }
document.addEventListener("click", e=>{ if(!e.target.closest(".secret-btn")&&!e.target.closest(".secret-menu")) document.getElementById("secretMenu").classList.remove("show"); });
loadSheet();
</script>
</body>
</html>
