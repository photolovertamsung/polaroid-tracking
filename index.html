<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หลังบ้าน — Polaroid_tamsung</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #1D9E75; --green-dark: #0F6E56; --green-light: #E1F5EE;
    --green-border: #9FE1CB; --green-text: #085041;
    --bg: #F7F5F0; --surface: #FFFFFF; --border: rgba(0,0,0,0.1);
    --text: #1a1a1a; --text-muted: #6b6b6b; --text-faint: #aaaaaa;
    --radius: 12px; --radius-sm: 8px;
    --red: #E24B4A; --red-light: #FCEBEB;
  }
  body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
  .logo { width: 38px; height: 38px; background: var(--green); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .logo svg { width: 20px; height: 20px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .header-text h1 { font-size: 15px; font-weight: 600; }
  .header-text p { font-size: 12px; color: var(--text-muted); }
  .back-link { margin-left: auto; font-size: 12px; color: var(--text-faint); text-decoration: none; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); }
  .main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .search-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .input-row { display: flex; gap: 8px; }
  .search-input { flex: 1; padding: 11px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: 'Sarabun', sans-serif; font-size: 14px; background: var(--bg); color: var(--text); outline: none; }
  .search-input:focus { border-color: var(--green); }
  .search-input::placeholder { color: var(--text-faint); }
  .search-btn { padding: 11px 18px; background: var(--green); color: white; border: none; border-radius: var(--radius-sm); font-family: 'Sarabun', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; }
  .hint { font-size: 12px; color: var(--text-faint); margin-top: 8px; }
  .sync-bar { font-size: 12px; color: var(--text-faint); display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); }
  .sync-dot.ok { background: var(--green); }

  /* admin card */
  .admin-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .admin-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .card-name { font-size: 15px; font-weight: 600; }
  .card-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .tracking-chip { font-size: 12px; background: var(--bg); padding: 4px 10px; border-radius: 20px; font-family: monospace; color: var(--text-muted); }

  /* photo section */
  .photo-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .photo-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .photo-item { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--bg); border: 1px solid var(--border); }
  .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-del { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.6); color: white; border: none; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }

  /* upload btn */
  .upload-area { border: 2px dashed var(--border); border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; transition: all 0.15s; }
  .upload-area:hover { border-color: var(--green); background: var(--green-light); }
  .upload-area.drag { border-color: var(--green); background: var(--green-light); }
  .upload-area input { display: none; }
  .upload-icon { font-size: 28px; margin-bottom: 6px; }
  .upload-text { font-size: 13px; color: var(--text-muted); }
  .upload-text span { color: var(--green); font-weight: 500; }
  .upload-hint { font-size: 11px; color: var(--text-faint); margin-top: 4px; }

  .empty-state { text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 14px; }
  .result-count { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="15" rx="2"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="8" r="1" fill="white" stroke="none"/></svg>
  </div>
  <div class="header-text">
    <h1>หลังบ้าน</h1>
    <p>อัพรูปสินค้าก่อนส่ง</p>
  </div>
  <a href="index.html" class="back-link">← หน้าหลัก</a>
</header>

<main class="main">

  <div class="sync-bar">
    <div class="sync-dot" id="syncDot"></div>
    <span id="syncStatus">กำลังโหลดข้อมูล...</span>
  </div>

  <p class="section-title">ค้นหาลูกค้า</p>
  <div class="search-card">
    <div class="input-row">
      <input class="search-input" id="searchInput" placeholder="พิมพ์ชื่อหรือเบอร์โทร..." oninput="doSearch()" autocomplete="off"/>
      <button class="search-btn" onclick="doSearch()">ค้นหา</button>
    </div>
    <p class="hint">พิมพ์บางส่วนก็ได้ค่ะ</p>
  </div>

  <div id="results"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRTvOZSL9sX3ezpv8wGlhHB4o50K6dPYPs5L_64JjQSbVPGtutC-YYixoMe_z7yJ8MY2rdmN64MEZTE/pub?output=csv";
let DB = [];

function splitCSV(line) {
  const r = []; let c = "", q = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') q = !q;
    else if (line[i] === ',' && !q) { r.push(c); c = ""; }
    else c += line[i];
  }
  r.push(c); return r;
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const h = splitCSV(lines[0]).map(x => x.trim());
  return lines.slice(1).map(l => {
    const v = splitCSV(l), o = {};
    h.forEach((k, i) => o[k] = (v[i]||"").trim());
    return o;
  }).filter(r => Object.values(r).some(v => v));
}

function mapRow(r) {
  const k = Object.keys(r);
  return { tracking: r[k[0]]||"", name: r[k[1]]||"", phone: r[k[2]]||"", province: r[k[3]]||"", date: r[k[4]]||"", courier: r[k[5]]||"SPX" };
}

function getPhotos(tracking) {
  try { return JSON.parse(localStorage.getItem("photo_"+tracking)||"[]"); } catch { return []; }
}

function savePhotos(tracking, photos) {
  localStorage.setItem("photo_"+tracking, JSON.stringify(photos));
}

async function loadSheet() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error();
    const text = await res.text();
    DB = parseCSV(text).map(mapRow).filter(r => r.tracking||r.name);
    document.getElementById("syncStatus").textContent = "โหลดข้อมูลสำเร็จ ("+DB.length+" รายการ)";
    document.getElementById("syncDot").className = "sync-dot ok";
  } catch {
    document.getElementById("syncStatus").textContent = "โหลดไม่สำเร็จ";
    document.getElementById("syncDot").className = "sync-dot err";
  }
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

function doSearch() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const container = document.getElementById("results");
  if (!q) { container.innerHTML = ""; return; }
  const found = DB.filter(r => r.name.toLowerCase().includes(q) || r.phone.includes(q));
  if (!found.length) { container.innerHTML = '<div class="empty-state">🔍<br>ไม่พบลูกค้า</div>'; return; }
  container.innerHTML = '<p class="result-count">พบ '+found.length+' รายการ</p>' + found.map((r,i) => buildCard(r, i)).join("");
  found.forEach((r, i) => attachUpload(r.tracking, i));
}

function buildCard(r, i) {
  const photos = getPhotos(r.tracking);
  const gridHtml = photos.length ? '<div class="photo-grid" id="grid_'+i+'">'+
    photos.map((p, pi) => '<div class="photo-item"><img src="'+p+'" alt="รูปสินค้า"><button class="photo-del" onclick="deletePhoto(\''+r.tracking+'\','+pi+','+i+')">✕</button></div>').join("")+
  '</div>' : '<div class="photo-grid" id="grid_'+i+'"></div>';

  return '<div class="admin-card">'+
    '<div class="admin-card-top">'+
      '<div><div class="card-name">'+r.name+'</div>'+
      '<div class="card-sub">'+r.phone+(r.province?' · '+r.province:'')+'</div></div>'+
      '<span class="tracking-chip">'+r.tracking+'</span>'+
    '</div>'+
    '<div class="photo-section">'+
      '<div class="photo-label">📷 รูปสินค้าก่อนส่ง ('+photos.length+' รูป)</div>'+
      gridHtml+
      '<label class="upload-area" id="uploadArea_'+i+'" ondragover="event.preventDefault();this.classList.add(\'drag\')" ondragleave="this.classList.remove(\'drag\')" ondrop="handleDrop(event,\''+r.tracking+'\','+i+')">'+
        '<input type="file" accept="image/*" multiple id="fileInput_'+i+'">'+
        '<div class="upload-icon">📸</div>'+
        '<div class="upload-text"><span>กดเพื่อเลือกรูป</span> หรือลากมาวาง</div>'+
        '<div class="upload-hint">รองรับ JPG, PNG, HEIC</div>'+
      '</label>'+
    '</div>'+
  '</div>';
}

function attachUpload(tracking, i) {
  document.getElementById("fileInput_"+i).addEventListener("change", function() {
    handleFiles(this.files, tracking, i);
  });
}

function handleDrop(e, tracking, i) {
  e.preventDefault();
  document.getElementById("uploadArea_"+i).classList.remove("drag");
  handleFiles(e.dataTransfer.files, tracking, i);
}

function handleFiles(files, tracking, i) {
  const photos = getPhotos(tracking);
  let loaded = 0;
  Array.from(files).forEach(file => {
    if (!file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = e => {
      photos.push(e.target.result);
      loaded++;
      if (loaded === files.length) {
        savePhotos(tracking, photos);
        refreshGrid(tracking, i);
        showToast("✅ อัพรูปสำเร็จ "+files.length+" รูป");
      }
    };
    reader.readAsDataURL(file);
  });
}

function deletePhoto(tracking, pi, i) {
  const photos = getPhotos(tracking);
  photos.splice(pi, 1);
  savePhotos(tracking, photos);
  refreshGrid(tracking, i);
  showToast("🗑 ลบรูปแล้ว");
}

function refreshGrid(tracking, i) {
  const photos = getPhotos(tracking);
  const grid = document.getElementById("grid_"+i);
  grid.innerHTML = photos.map((p, pi) => '<div class="photo-item"><img src="'+p+'" alt="รูปสินค้า"><button class="photo-del" onclick="deletePhoto(\''+tracking+'\','+pi+','+i+')">✕</button></div>').join("");
  const label = grid.previousElementSibling;
  if (label) label.textContent = "📷 รูปสินค้าก่อนส่ง ("+photos.length+" รูป)";
}

loadSheet();
</script>
</body>
</html>
