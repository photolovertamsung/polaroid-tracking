<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตรวจสอบสถานะ — Polaroid_tamsung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #1D9E75; --green-dark: #0F6E56; --green-light: #E1F5EE;
    --green-border: #9FE1CB; --green-text: #085041;
    --amber-bg: #FAEEDA; --amber-text: #854F0B;
    --delivered-bg: #EAF3DE; --delivered-text: #3B6D11;
    --red-bg: #FCEBEB; --red-text: #A32D2D;
    --bg: #F7F5F0; --surface: #FFFFFF; --border: rgba(0,0,0,0.1);
    --text: #1a1a1a; --text-muted: #6b6b6b; --text-faint: #aaaaaa;
    --radius: 12px; --radius-sm: 8px;
  }
  body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
  .logo { width: 38px; height: 38px; background: var(--green); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .logo svg { width: 20px; height: 20px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .header-text h1 { font-size: 15px; font-weight: 600; line-height: 1.2; }
  .header-text p { font-size: 12px; color: var(--text-muted); }
  .admin-link { margin-left: auto; font-size: 12px; color: var(--text-faint); text-decoration: none; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); }
  .admin-link:hover { background: var(--bg); }
  .main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
  .delivery-card { background: var(--green-light); border: 1px solid var(--green-border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
  .delivery-card h2 { font-size: 13px; font-weight: 600; color: var(--green-text); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .delivery-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--green-dark); margin-top: 4px; }
  .delivery-row span { font-weight: 600; }
  .search-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent; font-family: 'Sarabun', sans-serif; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .tab.active { background: var(--green); border-color: var(--green); color: white; }
  .input-row { display: flex; gap: 8px; }
  .search-input { flex: 1; padding: 11px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: 'Sarabun', sans-serif; font-size: 14px; background: var(--bg); color: var(--text); outline: none; }
  .search-input:focus { border-color: var(--green); }
  .search-input::placeholder { color: var(--text-faint); }
  .search-btn { padding: 11px 18px; background: var(--green); color: white; border: none; border-radius: var(--radius-sm); font-family: 'Sarabun', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; }
  .search-btn:hover { background: var(--green-dark); }
  .hint { font-size: 12px; color: var(--text-faint); margin-top: 8px; }
  .sync-bar { font-size: 12px; color: var(--text-faint); display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); }
  .sync-dot.ok { background: var(--green); }
  .sync-dot.err { background: #E24B4A; }
  .result-count { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .card-name { font-size: 15px; font-weight: 600; }
  .card-phone { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .card-province { font-size: 12px; color: var(--text-faint); }
  .badge { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; margin-left: 8px; }
  .badge-shipped { background: var(--green-light); color: var(--green-dark); }
  .badge-transit { background: var(--amber-bg); color: var(--amber-text); }
  .badge-delivered { background: var(--delivered-bg); color: var(--delivered-text); }
  .courier-row { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); background: var(--bg); padding: 4px 10px; border-radius: 20px; margin-bottom: 10px; }
  .tracking-row { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
  .tracking-label { font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
  .tracking-num { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; flex: 1; word-break: break-all; }
  .copy-btn { padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px; background: transparent; font-family: 'Sarabun', sans-serif; font-size: 12px; cursor: pointer; color: var(--text-muted); flex-shrink: 0; }
  .copy-btn.copied { background: var(--green-light); color: var(--green-dark); border-color: var(--green-border); }
  .product-img { width: 100%; border-radius: 8px; margin-top: 10px; max-height: 220px; object-fit: cover; display: block; }
  .no-img { display: none; }
  .empty-state { text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 14px; }
  .thank-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-top: 12px; text-align: center; }
  .thank-box p { font-size: 13px; color: var(--text-muted); line-height: 1.8; }
</style>
</head>
<body>
<header class="header">
  <div class="logo">
    <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="15" rx="2"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="8" r="1" fill="white" stroke="none"/></svg>
  </div>
  <div class="header-text">
    <h1>Polaroid_tamsung</h1>
    <p>ตรวจสอบสถานะคิวงานผลิต</p>
  </div>
  <a href="admin.html" class="admin-link">🔧 หลังบ้าน</a>
</header>

<main class="main">
  <div class="delivery-card">
    <h2>⏱ ระยะเวลาจัดส่งโดยประมาณ</h2>
    <div class="delivery-row">📍 กทม./ปริมณฑล &nbsp;<span>1–2 วัน</span></div>
    <div class="delivery-row">📍 ต่างจังหวัด &nbsp;<span>3–5 วัน</span></div>
  </div>

  <div class="sync-bar">
    <div class="sync-dot" id="syncDot"></div>
    <span id="syncStatus">กำลังโหลดข้อมูล...</span>
  </div>

  <div class="search-card">
    <div class="tabs">
      <button class="tab active" id="tabName" onclick="setTab('name')">👤 ค้นหาด้วยชื่อ</button>
      <button class="tab" id="tabPhone" onclick="setTab('phone')">📞 เบอร์โทร</button>
    </div>
    <div class="input-row">
      <input class="search-input" id="searchInput" placeholder="พิมพ์ชื่อลูกค้า..." oninput="doSearch()" autocomplete="off"/>
      <button class="search-btn" onclick="doSearch()">ค้นหา</button>
    </div>
    <p class="hint" id="hintText">เช่น สมใจ, พสุนาถ (พิมพ์บางส่วนก็ได้)</p>
  </div>

  <div id="results"></div>

  <div class="thank-box">
    <p>ขอบพระคุณที่อุดหนุนกันน้าค้าบบ 🙏🙇<br>เมื่อได้รับพัสดุแล้ว รบกวนฉีดแอลกอฮอลก่อนเปิดน้า 🥺<br>เพื่อความปลอดภัยงับ</p>
  </div>
</main>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRTvOZSL9sX3ezpv8wGlhHB4o50K6dPYPs5L_64JjQSbVPGtutC-YYixoMe_z7yJ8MY2rdmN64MEZTE/pub?output=csv";
const statusLabel = { shipped: "จัดส่งแล้ว", transit: "อยู่ระหว่างขนส่ง", delivered: "ส่งถึงแล้ว" };
const statusClass = { shipped: "badge-shipped", transit: "badge-transit", delivered: "badge-delivered" };
let DB = [], mode = "name";

function splitCSV(line) {
  const r = []; let c = "", q = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') q = !q;
    else if (line[i] === ',' && !q) { r.push(c); c = ""; }
    else c += line[i];
  }
  r.push(c); return r;
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const h = splitCSV(lines[0]).map(x => x.trim());
  return lines.slice(1).map(l => {
    const v = splitCSV(l), o = {};
    h.forEach((k, i) => o[k] = (v[i] || "").trim());
    return o;
  }).filter(r => Object.values(r).some(v => v));
}

function mapRow(r) {
  const k = Object.keys(r);
  return { tracking: r[k[0]]||"", name: r[k[1]]||"", phone: r[k[2]]||"", province: r[k[3]]||"", date: r[k[4]]||"", courier: r[k[5]]||"SPX", status: (r[k[6]]||"shipped").toLowerCase().trim() };
}

function getPhotos(tracking) {
  try { return JSON.parse(localStorage.getItem("photo_"+tracking)||"[]"); } catch { return []; }
}

async function loadSheet() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error("HTTP "+res.status);
    const text = await res.text();
    DB = parseCSV(text).map(mapRow).filter(r => r.tracking||r.name);
    document.getElementById("syncStatus").textContent = "ข้อมูลล่าสุดจาก Google Sheets ("+DB.length+" รายการ)";
    document.getElementById("syncDot").className = "sync-dot ok";
  } catch(e) {
    document.getElementById("syncStatus").textContent = "โหลดไม่สำเร็จ — "+e.message;
    document.getElementById("syncDot").className = "sync-dot err";
  }
}

function setTab(m) {
  mode = m;
  document.getElementById("tabName").className = "tab"+(m==="name"?" active":"");
  document.getElementById("tabPhone").className = "tab"+(m==="phone"?" active":"");
  document.getElementById("searchInput").value = "";
  document.getElementById("results").innerHTML = "";
  document.getElementById("hintText").textContent = m==="name" ? "เช่น สมใจ, พสุนาถ (พิมพ์บางส่วนก็ได้)" : "เช่น 081 หรือเบอร์เต็ม";
  document.getElementById("searchInput").placeholder = m==="name" ? "พิมพ์ชื่อลูกค้า..." : "พิมพ์เบอร์โทร...";
}

function doSearch() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const container = document.getElementById("results");
  if (!q) { container.innerHTML = ""; return; }
  const found = DB.filter(r => (r[mode]||"").toLowerCase().includes(q));
  if (!found.length) { container.innerHTML = '<div class="empty-state">📦<br>ไม่พบข้อมูล<br><small>ลองตรวจสอบชื่อหรือเบอร์อีกครั้ง</small></div>'; return; }
  container.innerHTML = '<p class="result-count">พบ '+found.length+' รายการ</p>' + found.map(r => {
    const st = (r.status in statusLabel) ? r.status : "shipped";
    const photos = getPhotos(r.tracking);
    const imgHtml = photos.length ? photos.map(p => '<img class="product-img" src="'+p+'" alt="รูปสินค้า" loading="lazy">').join("") : "";
    return '<div class="result-card">'+
      '<div class="card-top"><div>'+
        '<div class="card-name">'+r.name+'</div>'+
        '<div class="card-phone">'+r.phone+'</div>'+
        (r.province?'<div class="card-province">📍 '+r.province+'</div>':'')+
      '</div><span class="badge '+statusClass[st]+'">'+statusLabel[st]+'</span></div>'+
      '<div class="courier-row">🚚 '+r.courier+(r.date?' · '+r.date:'')+'</div>'+
      '<div class="tracking-row">'+
        '<span class="tracking-label">เลขพัสดุ</span>'+
        '<span class="tracking-num">'+r.tracking+'</span>'+
        '<button class="copy-btn" onclick="copyTracking(\''+r.tracking+'\',this)">คัดลอก</button>'+
      '</div>'+imgHtml+
    '</div>';
  }).join("");
}

function copyTracking(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = "✓ คัดลอกแล้ว"; btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "คัดลอก"; btn.classList.remove("copied"); }, 2000);
  });
}

loadSheet();
</script>
</body>
</html>
